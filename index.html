<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мерч университета</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&display=swap">
<style>
:root{--bg:#fff;--surface:#f7f1f2;--ink:#2a1318;--muted:#6b5459;--brand:#7a1f2e;--on-brand:#fff;--line:#e6d8da;--price:#7a1f2e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170c0f;--surface:#241318;--ink:#f7eeef;--muted:#b9a2a6;--brand:#8e2a3b;--line:#3a2328;--price:#e48e9d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#170c0f;--surface:#241318;--ink:#f7eeef;--muted:#b9a2a6;--brand:#8e2a3b;--line:#3a2328;--price:#e48e9d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.logo{font-family:Bitter,Georgia,serif}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--price);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;font-size:1rem}
.logo img{height:36px;width:auto;flex:none}
.logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cartbtn{flex:none;background:var(--on-brand);color:#7a1f2e;border:0;border-radius:4px;padding:8px 14px;font-weight:700}
.hero{background:var(--brand);color:var(--on-brand);padding:40px 20px 56px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2rem,8vw,3.6rem);line-height:1.05;margin:0 0 14px;font-weight:800;max-width:11em}
.hero p{margin:0 0 22px;max-width:30em;opacity:.92}
.emblem{position:absolute;right:48px;top:50%;translate:0 -50%;width:min(34vw,250px);color:#fff;pointer-events:none}
.emblem text{fill:#fff;font-family:Bitter,Georgia,serif;font-weight:800}
.emblem .ring{font-size:15px}
.emblem .mono{font-size:30px}
.emblem .spin{transform-origin:100px 100px;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:700px){.emblem{width:130px;right:14px;top:18px;translate:none;opacity:.3}}
.cta{display:inline-block;background:var(--on-brand);color:#7a1f2e;border-radius:4px;padding:12px 22px;font-weight:700;text-decoration:none}
.pennant{position:absolute;right:-30px;bottom:-20px;width:min(46vw,260px);aspect-ratio:1.4;background:var(--on-brand);opacity:.12;clip-path:polygon(0 0,100% 50%,0 100%)}
main{max-width:1000px;margin:0 auto;padding:32px 20px 48px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h2{margin:0;font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--brand);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:4.5rem;background:var(--surface);border-bottom:4px solid var(--brand);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:1.02rem}
.info p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.size{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.price{font-weight:800;color:var(--price)}
.add{background:var(--brand);color:var(--on-brand);border:0;border-radius:4px;padding:8px 12px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);color:var(--ink);z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.open .overlay{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.2rem}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1}
.items{flex:1;overflow-y:auto;padding:8px 20px}
.empty{color:var(--muted);padding:24px 0}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .ic{width:48px;height:48px;display:grid;place-items:center;font-size:1.8rem;background:var(--surface);border-radius:4px;overflow:hidden}
.it .ic img{width:100%;height:100%;object-fit:cover}
.it b{display:block;font-size:.95rem}
.it small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px}
.foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px}
.pay{width:100%;background:var(--brand);color:var(--on-brand);border:0;border-radius:4px;padding:12px;font-weight:700}
.pay:disabled{opacity:.5;cursor:not-allowed}
form label{display:block;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
form input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.note{margin:10px 0 0;color:var(--muted);font-size:.85rem;white-space:pre-wrap}
/* ===== дизайн и анимации ===== */
@keyframes up{from{opacity:0;translate:0 24px}to{opacity:1;translate:0 0}}
@keyframes pop{from{opacity:0;scale:.8}to{opacity:1;scale:1}}
@keyframes float{50%{translate:-14px -12px}}
@keyframes bump{40%{scale:1.18}}
header{box-shadow:0 2px 14px rgba(0,0,0,.18)}
.cartbtn,.cta,.add,.pay,.chip{transition:transform .15s,box-shadow .2s,background .2s,color .2s}
.cartbtn:hover,.cta:hover,.add:hover,.pay:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.22)}
.cartbtn:active,.cta:active,.add:active,.pay:active{transform:scale(.97)}
.chip:hover{background:var(--brand);color:var(--on-brand)}
.bump{animation:bump .35s}
.hero{background:linear-gradient(135deg,#5a1220,#7a1f2e 55%,#962e41);padding:72px 24px 88px}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.045) 0 2px,transparent 2px 22px);pointer-events:none}
.hero::after{content:"";position:absolute;left:-90px;bottom:-130px;width:320px;height:320px;border-radius:50%;border:2px solid rgba(255,255,255,.12);animation:float 9s ease-in-out infinite reverse}
.hero h1,.hero p,.hero .cta{position:relative;z-index:1}
.hero h1{font-size:clamp(2.2rem,8.5vw,4.2rem);letter-spacing:-.01em;animation:up .8s .1s both}
.hero p{font-size:1.1rem;animation:up .8s .3s both}
.cta{border-radius:999px;padding:14px 28px;animation:up .8s .5s both}
.emblem{animation:pop .9s .4s both}
.pennant{opacity:.14;animation:float 7s ease-in-out infinite}
main h2{position:relative;padding-bottom:10px}
main h2::after{content:"";position:absolute;left:0;bottom:0;width:48px;height:4px;background:var(--brand);border-radius:2px}
.card{opacity:0;translate:0 24px;transition:opacity .6s,translate .6s,transform .25s,box-shadow .25s,border-color .25s}
.card.in{opacity:1;translate:0 0}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 28px rgba(122,31,46,.18);border-color:var(--brand).tile{background:linear-gradient(160deg,var(--surface),var(--bg))}
.tile img,.tile .em{transition:transform .4s}
.tile .em{display:inline-block}
.card:hover .tile img{transform:scale(1.07)}
.card:hover .tile .em{transform:scale(1.15) rotate(-4deg)}
.add.ok{background:var(--on-brand);color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.it{animation:up .35s both}
.overlay{backdrop-filter:blur(2px)}
footer{background:var(--brand);color:var(--on-brand);text-align:center;padding:24px 20px;font-size:.9rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1;translate:none}.splash{display:none}}
.tile{position:relative}
.fav{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:var(--bg);color:var(--muted);font-size:1.2rem;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.18);transition:transform .2s,color .2s}
.fav:hover{transform:scale(1.12)}
.fav[aria-pressed="true"]{color:#c0283f;animation:bump .35s}
.reviews{margin-top:56px}
.avg{color:var(--muted);margin:0 0 18px}
.stars{color:var(--price);letter-spacing:2px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-bottom:32px}
.rc{border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:4px;padding:16px;background:var(--surface)}
.rc p{margin:8px 0}
.rc small{color:var(--muted)}
.rform{max-width:480px}
.rform h3{margin:0 0 12px}
form textarea,form select{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink);font:inherit}
.splash{position:fixed;inset:0;z-index:100;background:linear-gradient(135deg,#5a1220,#7a1f2e 55%,#962e41);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:splashout .8s 1.8s cubic-bezier(.7,0,.2,1) both}
@keyframes splashout{to{translate:0 -100%;opacity:0;visibility:hidden}}
.sp-mono{font:800 3.4rem Bitter,Georgia,serif;width:130px;height:130px;border:3px solid #fff;border-radius:50%;display:grid;place-items:center;animation:pop .8s both}
.sp-name{font:800 1.3rem Bitter,Georgia,serif;letter-spacing:.04em;text-align:center;padding:0 20px;animation:up .8s .3s both}
.sp-bar{width:160px;height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden;position:relative}
.sp-bar::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left;animation:load 1.6s ease-in-out both}
@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.hero h1{animation-delay:1.7s}
.hero p{animation-delay:1.9s}
.hero .cta{animation-delay:2.1s}
.emblem{animation-delay:2s}
footer{background:var(--brand);color:#fff;text-align:center;padding:24px 20px;font-size:.9rem}
</style>
</head>
<body>
  <div class="splash" id="splash">
  <div class="sp-mono">TAU</div>
  <div class="sp-name" data-name></div>
  <div class="sp-bar"></div>
</div>
<header>
  <div class="logo"><img id="logo" alt="" hidden><span data-name></span></div>
  <button class="cartbtn" id="open" aria-label="Открыть корзину">Корзина · <span id="count">0</span></button>
</header>

<section class="hero">
  <svg class="emblem" viewBox="0 0 200 200" aria-hidden="true">
    <defs><path id="ringpath" d="M100,100 m-78,0 a78,78 0 1,1 156,0 a78,78 0 1,1 -156,0"/></defs>
    <g class="spin"><text class="ring"><textPath href="#ringpath" id="ring"></textPath></text></g>
    <circle cx="100" cy="100" r="58" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="100" cy="100" r="50" fill="none" stroke="#fff" stroke-width="1" opacity=".5"/>
    <text class="mono" id="mono" x="100" y="111" text-anchor="middle"></text>
  </svg>
  <h1>Носите университет с гордостью</h1>
  <p>Атрибутика университета <span data-name></span></p>
  <a class="cta" href="#catalog">Смотреть каталог</a>
  <div class="pennant" aria-hidden="true"></div>
</section>

<main id="catalog">
  <div class="bar">
    <h2>Каталог</h2>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
  <section class="reviews" id="reviews">
  <h2>Отзывы</h2>
  <p class="avg" id="avg"></p>
  <div class="rgrid" id="rgrid"></div>
  <form id="rform" class="rform">
    <h3>Оставить отзыв</h3>
    <label>Имя<input name="n" required></label>
    <label>Оценка
      <select name="r">
        <option value="5">★★★★★</option><option value="4">★★★★☆</option>
        <option value="3">★★★☆☆</option><option value="2">★★☆☆☆</option><option value="1">★☆☆☆☆</option>
      </select>
    </label>
    <label>Отзыв<textarea name="t" rows="3" required></textarea></label>
    <button class="pay" type="submit">Отправить отзыв</button>
    <p class="note" id="rnote" hidden></p>
  </form>
</section>
</main>
<footer>©️ <span data-name></span></footer>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Корзина">
  <div class="dh"><h2>Ваш заказ</h2><button class="x" id="close" aria-label="Закрыть корзину">×</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Итого</span><span id="total"></span></div>
    <button class="pay" id="pay" disabled>Оформить заказ</button>
    <form id="form" hidden>
      <label>Имя<input name="n" required autocomplete="name"></label>
      <label>Телефон<input name="p" type="tel" required autocomplete="tel"></label>
      <button class="pay" type="submit">Отправить заказ в WhatsApp</button>
    </form>
    <p class="note" id="note" hidden></p>
  </div>
</aside>

<script>
/* ===== НАСТРОЙКИ: меняйте только этот блок и список товаров ===== */
var CONFIG = {
  shopName: "TURAN-ASTANA UNIVERSITY",
  logo: "logo.png",          // путь к логотипу, например "logo.png" (пусто — без логотипа)
  whatsapp: "7714929638",      // номер для заказов без плюса и пробелов, например "77011234567"
  currency: "₸"
};

/* Товары. img — путь к фото, например "photos/hoodie.jpg" (пусто — показывается значок icon).
   sizes — список размеров; для товаров без размера уберите эту строку.
   cat — категория: кнопки фильтра создаются автоматически. */
var PRODUCTS = [
  {id:1, name:"Худи с логотипом Университета", cat:"Одежда", price:15000, img:"photos.jpg", icon:"", sizes:["S","M","L","XL"], desc:""},
  {id:2, name:"", cat:"Одежда", price:6000, img:"", icon:"", sizes:["S","M","L","XL"], desc:""},
  {id:3, name:"", cat:"Одежда", price:5000, img:"", icon:"", sizes:["s","M","L","XL"], desc:""},
  {id:4, name:"", cat:"Аксессуары", price:3500, img:"", icon:"", desc:""},
  {id:5, name:"", cat:"Аксессуары", price:3000, img:"", icon:"", desc:""},
  {id:6, name:"", cat:"Аксессуары", price:2000, img:"", icon:"", desc:""},
  {id:7, name:"", cat:"Аксессуары", price:2000, img:"", icon:"", desc:""},
  {id:8, name:"", cat:"Одежда", price:5000, img:"", icon:"", sizes:["s","M","L","XL"], desc:""},
];
/* ===== конец настроек ===== */

var KEY = "shop-cart", cart = load(), cat = "all";
var FKEY="shop-fav", fav=loadFav();
function loadFav(){try{return JSON.parse(localStorage.getItem(FKEY)||"[]")}catch(e){return []}}
function saveFav(){try{localStorage.setItem(FKEY,JSON.stringify(fav))}catch(e){}}
var $ = function(i){return document.getElementById(i)};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function money(n){return n.toLocaleString("ru-RU")+" "+CONFIG.currency}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function prod(id){return PRODUCTS.filter(function(p){return String(p.id)===String(id)})[0]}
function pic(p){return p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':'<span class="em">'+p.icon+'</span>'}
function renderChips(){
  var cats=[];PRODUCTS.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
  $("chips").innerHTML=["all","fav"].concat(cats).map(function(c){
    return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+(c==="all"?"Все":c==="fav"?"♥ Избранное ("+fav.length+")":esc(c))+'</button>';
  }).join("");
  var REVIEWS = [
];
}
function renderGrid(){
  $("grid").innerHTML=PRODUCTS.filter(function(p){return cat==="all"||(cat==="fav"?fav.indexOf(p.id)>-1:p.cat===cat)}).map(function(p){
    var sz=p.sizes?'<select class="size" aria-label="Размер">'+p.sizes.map(function(s){return '<option>'+esc(s)+'</option>'}).join("")+'</select>':"";
    return '<article class="card"><div class="tile">'+pic(p)+'<button class="fav" data-fav="'+p.id+'" aria-label="В избранное" aria-pressed="'+(fav.indexOf(p.id)>-1)+'">♥</button></div><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc||"")+'</p>'+sz+'<div class="row"><span class="price">'+money(p.price)+'</span><button class="add" data-add="'+p.id+'">В корзину</button></div></div></article>';
  }).join("");
}
function lines(){
  return Object.keys(cart).map(function(k){
    var a=k.split("|"),p=prod(a[0]);
    return p?{key:k,p:p,size:a[1]||"",q:cart[k]}:null;
  }).filter(Boolean);
}
function renderCart(){
  var L=lines(),sum=0,n=0;
  $("items").innerHTML=L.length?L.map(function(l){
    sum+=l.p.price*l.q;n+=l.q;
    return '<div class="it"><div class="ic">'+pic(l.p)+'</div><div><b>'+esc(l.p.name)+'</b>'+(l.size?'<small>Размер: '+esc(l.size)+'</small><br>':"")+'<span class="price">'+money(l.p.price*l.q)+'</span></div><div class="qty"><button data-dec="'+esc(l.key)+'" aria-label="Меньше">−</button><span>'+l.q+'</span><button data-inc="'+esc(l.key)+'" aria-label="Больше">+</button></div></div>';
  }).join(""):'<p class="empty">Корзина пуста. Добавьте что-нибудь из каталога.</p>';
  $("total").textContent=money(sum);
  $("count").textContent=n;
  $("pay").disabled=!n;
  if(!n){$("form").hidden=true;$("pay").hidden=false}
  save();
}
function setOpen(v){document.body.classList.toggle("open",v)}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.add){
    var sel=t.closest(".card").querySelector(".size"),k=d.add+"|"+(sel?sel.value:"");
    cart[k]=(cart[k]||0)+1;$("note").hidden=true;renderCart();
    t.textContent="Добавлено ✓";t.classList.add("ok");
    setTimeout(function(){t.textContent="В корзину";t.classList.remove("ok")},1000);
    var cb=$("open");cb.classList.remove("bump");void cb.offsetWidth;cb.classList.add("bump");
  }else if(d.inc){cart[d.inc]++;renderCart()}
  else if(d.dec){if(--cart[d.dec]<=0)delete cart[d.dec];renderCart()}
  else if(d.cat){cat=d.cat;renderChips();renderGrid();reveal()}
  else if(d.fav){
  var id=Number(d.fav),i=fav.indexOf(id);
  if(i<0)fav.push(id);else fav.splice(i,1);
  saveFav();renderChips();
  if(cat==="fav"){renderGrid();reveal()}else t.setAttribute("aria-pressed",i<0);
}
});
$("open").onclick=function(){setOpen(true)};
$("close").onclick=$("overlay").onclick=function(){setOpen(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")setOpen(false)});
$("pay").onclick=function(){$("pay").hidden=true;$("form").hidden=false;$("note").hidden=true};

$("form").onsubmit=function(e){
  e.preventDefault();
  var f=e.target,L=lines(),sum=0;
  var msg="Заказ из магазина «"+CONFIG.shopName+"»:\n"+L.map(function(l,i){
    sum+=l.p.price*l.q;
    return (i+1)+". "+l.p.name+(l.size?" ("+l.size+")":"")+" × "+l.q+" — "+money(l.p.price*l.q);
  }).join("\n")+"\nИтого: "+money(sum)+"\nИмя: "+f.n.value+"\nТелефон: "+f.p.value;
  var note=$("note");note.hidden=false;
  if(CONFIG.whatsapp){
    window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg),"_blank");
    cart={};f.reset();renderCart();
    note.textContent="Заказ открыт в WhatsApp. Отправьте сообщение, чтобы завершить оформление.";
  }else{
    note.textContent="Укажите номер WhatsApp в настройках (CONFIG.whatsapp), и заказ будет открываться в чате. Текст заказа:\n\n"+msg;
  }
};

document.title="Мерч — "+"TURAN-ASTANA UNIVERSITY";
document.querySelectorAll("[data-name]").forEach(function(n){n.textContent="TURAN-ASTANA UNIVERSITY"});
if(CONFIG.logo){var lg=$("logo");lg.src=CONFIG.logo;lg.hidden=false}
$("mono").textContent="TAU";
function fitRing(){
  var r=$("ring");r.removeAttribute("letter-spacing");
  r.textContent="TURAN-ASTANA UNIVERSITY".toUpperCase()+" • ";
  var L=r.getComputedTextLength();
  r.setAttribute("letter-spacing",Math.max(0,(486-L)/r.textContent.length));
}
try{fitRing();if(document.fonts)document.fonts.ready.then(fitRing)}catch(e){}
var io="IntersectionObserver" in window?new IntersectionObserver(function(es){
  es.forEach(function(e){
    if(e.isIntersecting){var t=e.target;t.classList.add("in");io.unobserve(t);setTimeout(function(){t.style.transitionDelay=""},900)}
  });
},{threshold:.12}):null;
function reveal(){
  document.querySelectorAll(".card").forEach(function(c,i){
    c.style.transitionDelay=(i%4)*70+"ms";
    if(io)io.observe(c);else c.classList.add("in");
  });
}
function stars(n){return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function renderReviews(){
  var n=REVIEWS.length,avg=n?(REVIEWS.reduce(function(s,r){return s+r.rating},0)/n).toFixed(1):"";
  $("avg").innerHTML=n?'<span class="stars">'+stars(Math.round(avg))+'</span> '+avg+' · отзывов: '+n:"Пока нет отзывов. Будьте первым!";
  $("rgrid").innerHTML=REVIEWS.map(function(r){
    return '<article class="rc"><span class="stars">'+stars(r.rating)+'</span><p>'+esc(r.text)+'</p><small>'+esc(r.name)+(r.date?" · "+esc(r.date):"")+'</small></article>';
  }).join("");
}
$("rform").onsubmit=function(e){
  e.preventDefault();
  var f=e.target,note=$("rnote");
  var msg="Новый отзыв для магазина «"+CONFIG.shopName+"»:\nИмя: "+f.n.value+"\nОценка: "+f.r.value+"/5\nОтзыв: "+f.t.value;
  note.hidden=false;
  if(CONFIG.whatsapp){
    window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg),"_blank");
    f.reset();
    note.textContent="Спасибо! Отправьте сообщение в WhatsApp, и отзыв будет передан на проверку.";
  }else{
    note.textContent="Укажите номер WhatsApp в настройках (CONFIG.whatsapp). Текст отзыва:\n\n"+msg;
  }
};
renderChips();renderGrid();renderCart();reveal();renderReviews();
</script>
</body>
