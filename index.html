<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мерч университета</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;800&display=swap">
<style>
:root{--bg:#fff;--surface:#f7f1f2;--ink:#2a1318;--muted:#6b5459;--brand:#7e2e42;--on-brand:#fff;--line:#e6d8da;--price:#7a1f2e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#170c0f;--surface:#241318;--ink:#f7eeef;--muted:#b9a2a6;--brand:#8e2a3b;--line:#3a2328;--price:#e48e9d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#170c0f;--surface:#241318;--ink:#f7eeef;--muted:#b9a2a6;--brand:#800020;--line:#3a2328;--price:#e48e9d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,.logo{font-family:Bitter,Georgia,serif}
button,input,select{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--price);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--brand);color:var(--on-brand);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px}
.logo{display:flex;align-items:center;gap:10px;min-width:0;font-weight:800;font-size:1rem}
.logo img{height:36px;width:auto;flex:none}
.logo span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.herologo1{position:absolute;right:24px;top:40%;transform:translateY(-50%);height:140px;width:auto;max-width:35%;padding:20px 20px;border-radius:12px}
.herologo1[hidden]{display:none}
@media (max-width:700px){.herologo1{position:static;transform:none;display:block;height:80px;max-width:100%;margin-bottom:20px}}
.cartbtn{flex:none;background:var(--on-brand);color:#7a1f2e;border:0;border-radius:4px;padding:8px 14px;font-weight:700}
.hero{background:var(--brand);color:var(--on-brand);padding:40px 20px 56px;position:relative;overflow:hidden}
.hero h1{font-size:clamp(2rem,8vw,3.6rem);line-height:1.05;margin:0 0 14px;font-weight:800;max-width:11em}
.hero p{margin:0 0 22px;max-width:30em;opacity:.92} 
.cta{display:inline-block;background:var(--on-brand);color:#7a1f2e;border-radius:4px;padding:12px 22px;font-weight:700;text-decoration:none}
.pennant{position:absolute;right:-30px;bottom:-20px;width:min(46vw,260px);aspect-ratio:1.4;background:var(--on-brand);opacity:.12;clip-path:polygon(0 0,100% 50%,0 100%)}
main{max-width:1000px;margin:0 auto;padding:32px 20px 48px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h2{margin:0;font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--brand);background:transparent;color:var(--ink);border-radius:999px;padding:6px 14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:4px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.tile{aspect-ratio:1;display:grid;place-items:center;font-size:4.5rem;background:var(--surface);border-bottom:4px solid var(--brand);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.info{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.info h3{margin:0;font-size:1.02rem}
.info p{margin:0;color:var(--muted);font-size:.9rem;flex:1}
.size{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px;padding:6px 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px}
.price{font-weight:800;color:var(--price)}
.add{background:var(--brand);color:var(--on-brand);border:0;border-radius:4px;padding:8px 12px;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);color:var(--ink);z-index:50;transform:translateX(100%);transition:transform .25s;display:flex;flex-direction:column}
body.open .overlay{opacity:1;pointer-events:auto}
body.open .drawer{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.dh h2{font-size:1.2rem}
.x{background:none;border:0;color:var(--ink);font-size:1.6rem;line-height:1}
.items{flex:1;overflow-y:auto;padding:8px 20px}
.empty{color:var(--muted);padding:24px 0}
.it{display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.it .ic{width:48px;height:48px;display:grid;place-items:center;font-size:1.8rem;background:var(--surface);border-radius:4px;overflow:hidden}
.it .ic img{width:100%;height:100%;object-fit:cover}
.it b{display:block;font-size:.95rem}
.it small{color:var(--muted)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:4px}
.foot{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.total{display:flex;justify-content:space-between;font-weight:800;margin-bottom:12px}
.pay{width:100%;background:var(--brand);color:var(--on-brand);border:0;border-radius:4px;padding:12px;font-weight:700}
.pay:disabled{opacity:.5;cursor:not-allowed}
form label{display:block;margin-bottom:10px;font-size:.9rem;color:var(--muted)}
form input{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.note{margin:10px 0 0;color:var(--muted);font-size:.85rem;white-space:pre-wrap}
@media (prefers-reduced-motion:reduce){.drawer,.overlay{transition:none}}
</style>
</head>
<body>
<header>
  <div class="logo"><img id="logo" alt="" hidden><span data-name></span></div>
  <button class="cartbtn" id="open" aria-label="Открыть корзину">Корзина · <span id="count">0</span></button>
</header>

<section class="hero"> <img class="herologo1" src="logo1.png" alt="Логотип 1">
  <h1>Носите университет с гордостью</h1>
  <p>Атрибутика университета </p>
  <a class="cta" href="#catalog">Смотреть каталог</a>
  <div class="pennant" aria-hidden="true"></div>
</section>

<main id="catalog">
  <div class="bar">
    <h2>Каталог</h2>
    <div class="chips" id="chips"></div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Корзина">
  <div class="dh"><h2>Ваш заказ</h2><button class="x" id="close" aria-label="Закрыть корзину">×</button></div>
  <div class="items" id="items"></div>
  <div class="foot">
    <div class="total"><span>Итого</span><span id="total"></span></div>
    <button class="pay" id="pay" disabled>Оформить заказ</button>
    <form id="form" hidden>
      <label>Имя<input name="n" required autocomplete="name"></label>
      <label>Телефон<input name="p" type="tel" required autocomplete="tel"></label>
      <button class="pay" type="submit">Отправить заказ в WhatsApp</button>
    </form>
    <p class="note" id="note" hidden></p>
  </div>
</aside>

<script>
var CONFIG = {
  shopName: "TURAN-ASTANA UNIVERSITY",
  logo: "logo.png",          
  whatsapp: "7714929638",      
  currency: "₸"
};

/* Товары. img — путь к фото, например "photos/hoodie.jpg" (пусто — показывается значок icon).
   sizes — список размеров; для товаров без размера уберите эту строку.
   cat — категория: кнопки фильтра создаются автоматически. */
var PRODUCTS = [
  {id:1, name:"Худи с принтом логотипа", cat:"Одежда", price:15000, img:"PHOTOS.jpeg", icon:"", sizes:["S","M","L","XL"], desc:"Белая с бордовым принтом"},
  {id:2, name:"", cat:"Одежда", price:6000, img:"", icon:"", sizes:["S","M","L","XL"], desc:""},
  {id:3, name:"", cat:"Одежда", price:5000, img:"", icon:"", desc:""},
  {id:4, name:"", cat:"Аксессуары", price:3500, img:"", icon:"", desc:""},
  {id:5, name:"", cat:"Аксессуары", price:3000, img:"", icon:"", desc:""},
  {id:6, name:"", cat:"Аксессуары", price:2000, img:"", icon:"", desc:""}
];
/* ===== конец настроек ===== */

var KEY = "shop-cart", cart = load(), cat = "all";
var $ = function(i){return document.getElementById(i)};
function load(){try{return JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){return {}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(cart))}catch(e){}}
function money(n){return n.toLocaleString("ru-RU")+" "+CONFIG.currency}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function prod(id){return PRODUCTS.filter(function(p){return String(p.id)===String(id)})[0]}
function pic(p){return p.img?'<img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy">':p.icon}

function renderChips(){
  var cats=[];PRODUCTS.forEach(function(p){if(cats.indexOf(p.cat)<0)cats.push(p.cat)});
  $("chips").innerHTML=["all"].concat(cats).map(function(c){
    return '<button class="chip" data-cat="'+esc(c)+'" aria-pressed="'+(c===cat)+'">'+(c==="all"?"Все":esc(c))+'</button>';
  }).join("");
}
function renderGrid(){
  $("grid").innerHTML=PRODUCTS.filter(function(p){return cat==="all"||p.cat===cat}).map(function(p){
    var sz=p.sizes?'<select class="size" aria-label="Размер">'+p.sizes.map(function(s){return '<option>'+esc(s)+'</option>'}).join("")+'</select>':"";
    return '<article class="card"><div class="tile">'+pic(p)+'</div><div class="info"><h3>'+esc(p.name)+'</h3><p>'+esc(p.desc||"")+'</p>'+sz+'<div class="row"><span class="price">'+money(p.price)+'</span><button class="add" data-add="'+p.id+'">В корзину</button></div></div></article>';
  }).join("");
}
function lines(){
  return Object.keys(cart).map(function(k){
    var a=k.split("|"),p=prod(a[0]);
    return p?{key:k,p:p,size:a[1]||"",q:cart[k]}:null;
  }).filter(Boolean);
}
function renderCart(){
  var L=lines(),sum=0,n=0;
  $("items").innerHTML=L.length?L.map(function(l){
    sum+=l.p.price*l.q;n+=l.q;
    return '<div class="it"><div class="ic">'+pic(l.p)+'</div><div><b>'+esc(l.p.name)+'</b>'+(l.size?'<small>Размер: '+esc(l.size)+'</small><br>':"")+'<span class="price">'+money(l.p.price*l.q)+'</span></div><div class="qty"><button data-dec="'+esc(l.key)+'" aria-label="Меньше">−</button><span>'+l.q+'</span><button data-inc="'+esc(l.key)+'" aria-label="Больше">+</button></div></div>';
  }).join(""):'<p class="empty">Корзина пуста. Добавьте что-нибудь из каталога.</p>';
  $("total").textContent=money(sum);
  $("count").textContent=n;
  $("pay").disabled=!n;
  if(!n){$("form").hidden=true;$("pay").hidden=false}
  save();
}
function setOpen(v){document.body.classList.toggle("open",v)}

document.addEventListener("click",function(e){
  var t=e.target.closest("button");if(!t)return;
  var d=t.dataset;
  if(d.add){
    var sel=t.closest(".card").querySelector(".size"),k=d.add+"|"+(sel?sel.value:"");
    cart[k]=(cart[k]||0)+1;$("note").hidden=true;renderCart();
  }else if(d.inc){cart[d.inc]++;renderCart()}
  else if(d.dec){if(--cart[d.dec]<=0)delete cart[d.dec];renderCart()}
  else if(d.cat){cat=d.cat;renderChips();renderGrid()}
});
$("open").onclick=function(){setOpen(true)};
$("close").onclick=$("overlay").onclick=function(){setOpen(false)};
document.addEventListener("keydown",function(e){if(e.key==="Escape")setOpen(false)});
$("pay").onclick=function(){$("pay").hidden=true;$("form").hidden=false;$("note").hidden=true};

$("form").onsubmit=function(e){
  e.preventDefault();
  var f=e.target,L=lines(),sum=0;
  var msg="Заказ из магазина «"+CONFIG.shopName+"»:\n"+L.map(function(l,i){
    sum+=l.p.price*l.q;
    return (i+1)+". "+l.p.name+(l.size?" ("+l.size+")":"")+" × "+l.q+" — "+money(l.p.price*l.q);
  }).join("\n")+"\nИтого: "+money(sum)+"\nИмя: "+f.n.value+"\nТелефон: "+f.p.value;
  var note=$("note");note.hidden=false;
  if(CONFIG.whatsapp){
    window.open("https://wa.me/"+CONFIG.whatsapp+"?text="+encodeURIComponent(msg),"_blank");
    cart={};f.reset();renderCart();
    note.textContent="Заказ открыт в WhatsApp. Отправьте сообщение, чтобы завершить оформление.";
  }else{
    note.textContent="Укажите номер WhatsApp в настройках (CONFIG.whatsapp), и заказ будет открываться в чате. Текст заказа:\n\n"+msg;
  }
};

document.title="Мерч — "+CONFIG.shopName;
document.querySelectorAll("[data-name]").forEach(function(n){n.textContent=CONFIG.shopName});
if(CONFIG.logo){var lg=$("logo");lg.src=CONFIG.logo;lg.hidden=false}
renderChips();renderGrid();renderCart();
</script>
</body>
</html>
